services:
  - type: web
    name: eu-backend
    env: python
    plan: free
    rootDir: EU_Back
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: eu-postgres
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WEB_LAB_RETRIEVER_MODE
        value: v2
      - key: WEB_LAB_RETRIEVER_SHADOW
        value: "false"
      - key: WEB_LAB_RETRIEVER_PROFILE
        value: precision_first
      - key: CORS_ORIGINS
        value: "*"
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: eu-frontend
    env: static
    rootDir: EU_Front
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: eu-postgres
    plan: free
